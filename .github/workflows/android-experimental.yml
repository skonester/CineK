name: Android APK (Experimental)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-experimental.yml'
      - 'gradle/wrapper/**'
      - 'gradlew'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build experimental debug APK
        # Via bash, so the build does not depend on gradlew keeping its executable bit through Windows commits.
        run: bash ./gradlew -p android :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: CineK-Android-Experimental
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
