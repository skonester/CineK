name: CineK Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-experimental.yml'
      - 'gradle/wrapper/**'
      - 'gradlew'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Configure optional metadata APIs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: |
          printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" > android/local.properties
          printf 'OPENSUBTITLES_API_KEY=%s\n' "$OPENSUBTITLES_API_KEY" >> android/local.properties
      - name: Build and test CineK Android TV
        # Via bash, so the build does not depend on gradlew keeping its executable bit through Windows commits.
        run: bash ./gradlew -p android :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: CineK-Android-TV
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
