name: Windows Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022 # Includes Inno Setup 6, which scripts/build-setup.ps1 needs.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check release tag matches the installer version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $gradle = Get-Content build.gradle.kts -Raw
          $version = [regex]::Match($gradle, '(?m)^version = "([^"]+)"').Groups[1].Value
          if (-not $version -or '${{ github.ref_name }}' -ne "v$version") {
            throw "Release tag must match build.gradle.kts version: v$version"
          }

      - name: Build and check Windows installer
        shell: pwsh
        run: ./scripts/build-setup.ps1

      - name: Upload installer from this run
        uses: actions/upload-artifact@v4
        with:
          name: CineK-Windows-Setup
          path: out/setup/CineK-*-Setup.exe
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/setup/CineK-*-Setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
