name: Windows Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022 # Includes Inno Setup 6, which scripts/build-setup.ps1 needs.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Determine release tag
        id: release
        shell: pwsh
        run: |
          $gradle = Get-Content build.gradle.kts -Raw
          $version = [regex]::Match($gradle, '(?m)^version = "([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'Cannot read the version from build.gradle.kts.' }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Release tag must match build.gradle.kts version: $tag"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Run manual releases from the main branch.'
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $remoteTags = @(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
            if ($LASTEXITCODE -ne 0) { throw "Could not check the existing $tag tag." }
            $existing = $remoteTags | Where-Object { $_ -match '\^\{\}$' } | Select-Object -First 1
            if (-not $existing) { $existing = $remoteTags | Select-Object -First 1 }
            if ($existing -and ($existing -split '\s+')[0] -ne $env:GITHUB_SHA) {
              throw "$tag already points to another commit. Increase the version before publishing again."
            }
          }
          "tag_name=$tag" >> $env:GITHUB_OUTPUT

      - name: Build and check Windows installer
        shell: pwsh
        run: ./scripts/build-setup.ps1

      - name: Upload installer from this run
        uses: actions/upload-artifact@v6
        with:
          name: CineK-Windows-Setup
          path: out/setup/CineK-*-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: out/setup/CineK-*-Setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
